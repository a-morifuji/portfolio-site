<!DOCTYPE html>
    <html lang="ja">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ホーム&nbsp;|&nbsp;Asuka&nbsp;Morifuji&nbsp;Portfolio</title>

        <!-- Googleフォント -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
    <header id="header">
        <div class="wrapper">
            <h1>
                <a href="/index.html">
                    <img src="/img/logo_ol.webp" alt="ロゴ">
                </a>
            </h1>

            <nav>
                <ul>
                    <li><a href="#works">制作物</a></li>
                    <li><a href="/html/profile/profile.html">プロフィール</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- MV -->
        <section id="mv">
            <div class="wrapper">
                <img src="/img/mv_ol.webp" alt="メインビジュアルの画像">
            </div>
        </section>

        <!-- 制作物 -->
        <section id="works">
            <div class="wrapper">
                <div class="center">
                    <h2>制作物</h2>

                    <ul class="filter-list">
                        <li><button type="button" class="filter-btn active" data-filter="all">All</button></li>
                        <li><button type="button" class="filter-btn" data-filter="web">Web</button></li>
                        <li><button type="button" class="filter-btn" data-filter="lp">LP</button></li>
                        <li><button type="button" class="filter-btn" data-filter="graphic">Graphic</button></li>
                        <li><button type="button" class="filter-btn" data-filter="movie">Movie</button></li>
                    </ul>

                    <!-- ★ここにJSで作品が自動生成される -->
                    <div id="works_list"></div>
                </div>
            </div>
        </section>

        <!-- プロフィール -->
        <section id="profile">
            <div class="wrapper">
                <h2 class="section_title">プロフィール</h2>
                <div class="profile_card">
                    <div class="profile_img">
                        <img src="/img/profile/iconPhoto.webp" alt="プロフィール画像">
                    </div>

                    <div class="profile_info">
                        <dl>
                            <div class="dl_row">
                                <dt>森藤 明日花</dt>
                                <dd>Asuka Morifuji</dd>
                            </div>
                            <div class="dl_row">
                                <dt>生年月日</dt>
                                <dd>2001年04月30日</dd>
                            </div>
                        </dl>
                        <p class="profile_text">
                            人の役に立つ仕事がしたいと思い、IT企業でWebプログラマーとして、3年程従事。
                            2026年5月から創造者リカレントスクールへ入学し、Webデザイン(HTML、CSS)やデザインスキル、動画制作を学習中。
                        </p>
                        <a href="/html/profile/profile.html" class="more_btn">もっと見る &rarr;</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- お礼 -->
        <section id="thanks">
            <div class="wrapper">
                <h2>最後までご覧いただき<br class="sp_only">ありがとうございます</h2>
            </div>
        </section>
    </main>

    <footer>
        <small>&copy;2026&nbsp;Asuka&nbsp;Morifuji</small>
    </footer>

    <script src="/javascript/script.js"></script>
</body>
</html>
